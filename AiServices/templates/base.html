<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Cancer Prediction System</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(to right, #141E30, #243B55);
        color: white;
        min-height: 100vh;
        padding: 30px;
    }

    .container {
        width: 85%;
        max-width: 1100px;
        margin: auto;
        background: #1f2a44;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
        text-align: center;
        color: #00ffcc;
        margin-bottom: 25px;
        font-size: 32px;
    }

    .subtitle {
        text-align: center;
        margin-bottom: 30px;
        color: #dcdcdc;
        font-size: 15px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 8px;
        font-size: 14px;
        color: #f1f1f1;
    }

    input {
        padding: 12px;
        border: none;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 30px;
        background: #00ffcc;
        color: black;
        border: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #00d9ad;
    }

    .result {
        margin-top: 30px;
        background: #102840;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 24px;
        color: yellow;
        font-weight: bold;
        border: 1px solid #00ffcc;
    }

    @media (max-width: 768px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .container {
            width: 95%;
        }

        h2 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h2>AI Eye Cancer Prediction System</h2>

    <p class="subtitle">
        Genetic Test Report with AI Prediction for Doctor Decision Support
    </p>

    <form method="POST">

        <div class="grid">
            <div class="form-group">
                <label>Patient_ID</label>
                <input type="number" name="Id" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="Age" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <input type="text" name="Gender" placeholder="Male / Female" required>
            </div>

            <div class="form-group">
                <label>Cancer Type</label>
                <input type="text" name="Cancer_Type" placeholder="Retinoblastoma" required>
            </div>

            <div class="form-group">
                <label>Laterality</label>
                <input type="text" name="Laterality" placeholder="Left / Right / Both" required>
            </div>

         

            <div class="form-group">
                <label>Stage at Diagnosis</label>
                <input type="text" name="Stage_at_Diagnosis" placeholder="Stage II" required>
            </div>

            <div class="form-group">
                <label>Treatment Type</label>
                <input type="text" name="Treatment_Type" placeholder="Surgery" required>
            </div>

            <div class="form-group">
                <label>Surgery Status</label>
                <input type="text" name="Surgery_Status" placeholder="Yes / No" required>
            </div>

            <div class="form-group">
                <label>Radiation Therapy</label>
                <input type="text" name="Radiation_Therapy" placeholder="True / False" required>
            </div>

            <div class="form-group">
                <label>Chemotherapy</label>
                <input type="text" name="Chemotherapy" placeholder="True / False" required>
            </div>

            <div class="form-group">
                <label>Genetic Markers</label>
                <input type="text" name="Genetic_Markers" placeholder="RB1 Mutation" required>
            </div>

            <div class="form-group">
                <label>Family History</label>
                <input type="text" name="Family_History" placeholder="True / False" required>
            </div>

           

        </div>

        <button type="submit">
            Predict Eye Cancer Outcome
        </button>

    </form>

    {% if prediction %}
    <div class="result">
        Predicted Outcome Status: {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
